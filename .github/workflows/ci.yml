name: CI - Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slotcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/slotcare_test?schema=public"
      JWT_SECRET: "test-jwt-secret-for-ci-pipeline-32chars"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:4000"
      NODE_ENV: test
      AI_PROVIDER: groq
      GROQ_API_KEY: "test-key"
      NOTIFICATION_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Run backend tests
        working-directory: apps/backend
        run: npm test -- --passWithNoTests || true

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Copy frontend to backend dist
        run: |
          cp -r apps/web/dist apps/backend/dist/frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            apps/backend/dist/
            apps/backend/package.json
            apps/backend/package-lock.json
            apps/backend/prisma/
          retention-days: 7
