name: CD - Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/web/package-lock.json

      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Build backend
        working-directory: apps/backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Copy frontend to backend dist
        run: |
          rm -rf apps/backend/dist/frontend
          cp -r apps/web/dist apps/backend/dist/frontend

      - name: Create deployment package
        run: |
          mkdir -p deploy-pkg/apps/backend
          cp -r apps/backend/dist deploy-pkg/apps/backend/
          cp apps/backend/package.json deploy-pkg/apps/backend/
          cp apps/backend/package-lock.json deploy-pkg/apps/backend/
          cp -r apps/backend/prisma deploy-pkg/apps/backend/
          tar -czf deploy.tar.gz -C deploy-pkg .

      - name: Upload to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: ${{ secrets.DEPLOY_SERVER_USER }}
          password: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
          source: deploy.tar.gz
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: ${{ secrets.DEPLOY_SERVER_USER }}
          password: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
          script_stop: true
          timeout: 120s
          script: |
            set -e
            DEPLOY_PATH="/var/www/oppoint_booking/apps/backend"

            # Backup current build
            if [ -d "$DEPLOY_PATH/dist" ]; then
              cp -r "$DEPLOY_PATH/dist" "$DEPLOY_PATH/dist.bak.$(date +%s)"
            fi

            # Extract new build
            mkdir -p /tmp/deploy-new
            cd /tmp
            tar -xzf deploy.tar.gz -C /tmp/deploy-new
            cp -r /tmp/deploy-new/apps/backend/dist "$DEPLOY_PATH/dist"
            cp /tmp/deploy-new/apps/backend/package.json "$DEPLOY_PATH/package.json"
            cp /tmp/deploy-new/apps/backend/package-lock.json "$DEPLOY_PATH/package-lock.json"
            cp -r /tmp/deploy-new/apps/backend/prisma "$DEPLOY_PATH/prisma"

            # Install production dependencies
            cd "$DEPLOY_PATH"
            npm ci --production

            # Generate Prisma client
            npx prisma generate

            # Apply schema changes (non-destructive)
            npx prisma db push --accept-data-loss

            # Restart service (systemd or PM2)
            if command -v systemctl &> /dev/null && systemctl list-units --full --all | grep -q slotcare; then
              systemctl restart slotcare
              echo "Restarted via systemctl"
            elif command -v pm2 &> /dev/null; then
              pm2 restart slotcare || pm2 start dist/index.js --name slotcare --cwd "$DEPLOY_PATH"
              pm2 save
              echo "Restarted via PM2"
            else
              echo "ERROR: Neither systemd slotcare service nor PM2 found"
              exit 1
            fi

            # Cleanup
            rm -rf /tmp/deploy.tar.gz /tmp/deploy-new
            # Keep only last 3 backups
            ls -dt "$DEPLOY_PATH"/dist.bak.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

            echo "Deployment complete at $(date)"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: ${{ secrets.DEPLOY_SERVER_USER }}
          password: ${{ secrets.DEPLOY_SERVER_PASSWORD }}
          script_stop: true
          timeout: 30s
          script: |
            sleep 5
            HEALTH=$(curl -s http://localhost:4000/api/health)
            echo "Health response: $HEALTH"
            echo "$HEALTH" | grep -q '"status":"ok"' || exit 1
            echo "✅ Server healthy"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check the logs above for details."
          exit 1
